# Preserve the existing power and wireless behavior.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_EXT_POWER=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Preserve the latest successful 5keys build's key timing and mouse keys.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_ZMK_POINTING=y

# The left-only nice_view shield enables its display and disables idle blanking.
# Leave display support off on the right, which has no screen.
