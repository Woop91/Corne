# Two nice!nano v2 pairs. Choose artifacts for the pair being flashed.
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
      -DCONFIG_NICE_VIEW_WIDGET_STATUS=n
      -DCONFIG_CORNE_BATTERY_DISPLAY=y
    artifact-name: corne-left-niceview
  - board: nice_nano_v2
    shield: corne_right
    artifact-name: corne-right
  - board: nice_nano_v2
    shield: corne_left corne_oled_compact
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
      -DCONFIG_ZMK_DISPLAY=y
      -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
      -DCONFIG_CORNE_OLED_DISPLAY=y
    artifact-name: corne-left-oled
  - board: nice_nano_v2
    shield: corne_right corne_oled_compact
    cmake-args: >-
      -DCONFIG_ZMK_DISPLAY=y
      -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
      -DCONFIG_CORNE_OLED_DISPLAY=y
    artifact-name: corne-right-oled
